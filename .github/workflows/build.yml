name: Build Mod APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip python3
          wget -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          wget -O signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          wget -O gadget.xz https://github.com/frida/frida/releases/download/16.5.9/frida-gadget-16.5.9-android-arm64.so.xz
          unxz gadget.xz && mv gadget libgadget.so
      - name: Patch APK
        run: |
          APK=$(ls *.apk | head -1)
          java -jar apktool.jar d "$APK" -o src -f
          mkdir -p src/lib/arm64-v8a
          cp libgadget.so src/lib/arm64-v8a/
          ACT=src/smali/com/unity3d/player/UnityPlayerActivity.smali
          python3 -c "
import io
p='$ACT'
t=io.open(p,encoding='utf-8',errors='ignore').read()
inj='\n    const-string v0, \"gadget\"\n    invoke-static {v0}, Ljava/lang/System;->loadLibrary(Ljava/lang/String;)V\n'
if 'loadLibrary(\"gadget\")' not in t:
    t=t.replace('.method protected onCreate(Landroid/os/Bundle;)V','.method protected onCreate(Landroid/os/Bundle;)V'+inj)
    io.open(p,'w',encoding='utf-8').write(t)
"
          mkdir -p src/assets
          cp hook.js src/assets/hook.js
          printf '%s' '{"interaction":{"type":"script","path":"hook.js","on_change":"reload"}}' > src/assets/gadget.config
          java -jar apktool.jar b src -o mod.apk -f
          java -jar signer.jar -a mod.apk --allowResign -o out
      - uses: actions/upload-artifact@v4
        with:
          name: mod-apk
          path: out/*.apk
